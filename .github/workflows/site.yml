name: Atualizar ofertas e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *" # todo dia às 6h de Brasília
  workflow_dispatch: # permite rodar na hora pelo botão "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Sempre a ponta da main: uma reexecução de uma rodada antiga não volta o site no tempo.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Se o Telegram falhar, a página é publicada mesmo assim com as ofertas anteriores.
      - name: Ler ofertas do canal
        continue-on-error: true
        run: node scripts/atualizar-ofertas.mjs

      # Páginas de campanha: data/campanhas.json → promos/<slug>/index.html
      - name: Gerar páginas de campanha
        run: node scripts/gerar-campanhas.mjs

      - name: Guardar ofertas novas no repositório
        run: |
          git add -A promos
          git add data/ofertas.json assets/img/ofertas 2>/dev/null || git add data/ofertas.json
          if git diff --cached --quiet; then
            echo "Nada novo para guardar."
          else
            git -c user.name="ofertas-bot" -c user.email="ofertas-bot@users.noreply.github.com" \
              commit -m "Atualiza ofertas e páginas de campanha"
            # Se a main andou enquanto esta rodada lia o canal, entra por cima dela.
            # Se nem assim der, a publicação segue e as ofertas ficam para a próxima rodada.
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Ofertas guardadas."
            else
              git rebase --abort 2>/dev/null || true
              echo "::warning::Não foi possível guardar as ofertas agora; a próxima rodada tenta de novo."
            fi
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
