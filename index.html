<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>REF: — Watches &amp; Culture</title>
  <meta name="description" content="Grupos de ofertas de relógio, a confraria e as redes da REF: (@refdoispontos).">
  <meta name="theme-color" content="#FAF9F6">
  <meta property="og:title" content="REF: — Watches &amp; Culture">
  <meta property="og:description" content="Ofertas de relógio da Amazon e do Mercado Livre, direto no seu WhatsApp.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:ital,wght@0,500;0,600;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="page">

    <header class="topo">
      <a class="logo" href="./" aria-label="REF:">REF<span>:</span></a>
      <p class="micro" id="assinatura">Watches &amp; Culture</p>
    </header>

    <main>
      <section class="abertura" id="abertura" aria-labelledby="abertura-titulo">
        <p class="micro" id="handle">@refdoispontos</p>
        <h1 class="display" id="abertura-titulo"></h1>
        <p class="texto" id="abertura-texto"></p>
        <a class="btn btn-vermelho" id="abertura-botao" href="g/promos/"></a>
        <p class="micro nota" id="abertura-nota"></p>
        <a class="alternativa" id="abertura-alternativa" href="g/telegram/" hidden></a>
      </section>

      <section class="acao" id="acao" hidden aria-labelledby="acao-nome">
        <p class="micro">Ação da vez<span id="acao-codigo"></span><span id="acao-prazo"></span></p>
        <h2 class="display-2" id="acao-nome"></h2>
        <p class="micro complemento" id="acao-complemento" hidden></p>
        <img class="acao-arte" id="acao-imagem" hidden alt="">
        <p class="texto" id="acao-descricao"></p>
        <dl class="acao-detalhes" id="acao-detalhes" hidden></dl>
        <a class="btn btn-branco" id="acao-botao" href="g/acao/"></a>
      </section>

      <section class="ofertas" id="ofertas" hidden aria-labelledby="ofertas-titulo">
        <div class="cabeca">
          <h2 class="display-2" id="ofertas-titulo">Ofertas<br>recentes</h2>
          <div class="abas" id="abas" role="tablist" aria-label="Loja"></div>
        </div>
        <div class="trilho" id="trilho" tabindex="0" aria-label="Ofertas, arraste para o lado"></div>
      </section>

      <section class="grupos" id="grupos" aria-labelledby="grupos-titulo">
        <p class="micro">WhatsApp e Telegram</p>
        <h2 class="display-2" id="grupos-titulo">Entre<br>no grupo</h2>
        <ol class="lista-grupos" id="lista-grupos"></ol>
      </section>

      <section class="historia" id="historia" aria-labelledby="historia-titulo">
        <p class="micro">A história</p>
        <h2 class="display-2" id="historia-titulo">O que é<br>a REF<span class="vermelho">:</span></h2>
        <div id="historia-resumo"></div>
        <details id="historia-mais" hidden>
          <summary>Ler mais</summary>
          <div id="historia-completo"></div>
        </details>
      </section>

      <section class="redes" aria-labelledby="redes-titulo">
        <p class="micro" id="redes-titulo">Redes</p>
        <ul class="lista-redes" id="lista-redes"></ul>
      </section>
    </main>

    <footer class="rodape">
      <p id="rodape-afiliados"></p>
      <p><a id="rodape-contato" hidden></a></p>
      <p class="micro">REF: · @refdoispontos</p>
    </footer>

  </div>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
