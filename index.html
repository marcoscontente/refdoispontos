<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>REF: — Watches &amp; Culture</title>
  <meta name="description" content="Grupos de ofertas de relógio, a confraria e as redes da REF: (@refdoispontos).">
  <meta name="theme-color" content="#FAF9F6">
  <meta property="og:title" content="REF: — Watches &amp; Culture">
  <meta property="og:description" content="Ofertas de relógio da Amazon e do Mercado Livre, direto no seu WhatsApp.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:ital,wght@0,500;0,600;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/pixel.js"></script>
</head>
<body>
  <div class="page">

    <header class="topo">
      <a class="logo" href="./" aria-label="REF:">REF<span>:</span></a>
      <p class="micro" id="assinatura">Watches &amp; Culture</p>
    </header>

    <main>
      <section class="abertura" id="abertura" aria-labelledby="abertura-titulo">
        <p class="micro" id="handle">@refdoispontos</p>
        <h1 class="display" id="abertura-titulo"></h1>
        <p class="texto" id="abertura-texto"></p>
        <a class="btn btn-whatsapp" href="g/promos/">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
          <span id="abertura-botao"></span>
        </a>
        <a class="btn btn-telegram" id="abertura-telegram" href="g/telegram/" hidden>
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
          <span id="abertura-alternativa"></span>
        </a>
        <p class="micro nota" id="abertura-nota"></p>
      </section>

      <section class="acao" id="acao" hidden aria-labelledby="acao-nome">
        <p class="micro">Ação da vez<span id="acao-codigo"></span><span id="acao-prazo"></span></p>
        <h2 class="display-2" id="acao-nome"></h2>
        <p class="micro complemento" id="acao-complemento" hidden></p>
        <img class="acao-arte" id="acao-imagem" hidden alt="">
        <p class="texto" id="acao-descricao"></p>
        <dl class="acao-detalhes" id="acao-detalhes" hidden></dl>
        <a class="btn btn-branco" id="acao-botao" href="g/acao/"></a>
      </section>

      <section class="ofertas" id="ofertas" hidden aria-labelledby="ofertas-titulo">
        <div class="cabeca">
          <h2 class="display-2" id="ofertas-titulo">Ofertas<br>recentes</h2>
          <div class="abas" id="abas" role="tablist" aria-label="Loja"></div>
        </div>
        <div class="trilho" id="trilho" tabindex="0" aria-label="Ofertas, role a lista"></div>
      </section>

      <section class="grupos" id="grupos" aria-labelledby="grupos-titulo">
        <p class="micro">WhatsApp e Telegram</p>
        <h2 class="display-2" id="grupos-titulo">Entre<br>no grupo</h2>
        <ol class="lista-grupos" id="lista-grupos"></ol>
      </section>

      <section class="historia" id="historia" aria-labelledby="historia-titulo">
        <p class="micro">A história</p>
        <h2 class="display-2" id="historia-titulo">Por que<br>a REF<span class="vermelho">:</span> existe</h2>
        <div id="historia-resumo"></div>
        <details id="historia-mais" hidden>
          <summary>Ler mais</summary>
          <div id="historia-completo"></div>
        </details>
        <p class="micro assinatura" id="historia-assinatura" hidden></p>
        <div class="reel" id="historia-reel" hidden></div>
        <a class="video" id="historia-video" target="_blank" rel="noopener" hidden></a>
      </section>

      <section class="redes" aria-labelledby="redes-titulo">
        <p class="micro" id="redes-titulo">Redes</p>
        <ul class="lista-redes" id="lista-redes"></ul>
      </section>
    </main>

    <footer class="rodape">
      <p id="rodape-afiliados"></p>
      <p><a id="rodape-contato" hidden></a></p>
      <p class="micro">REF: · @refdoispontos</p>
    </footer>

  </div>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
